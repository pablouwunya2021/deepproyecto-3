name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias (torch CPU)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 torchvision==0.28.0
          pip install -r requirements-dev.txt
      - name: Pruebas
        run: pytest -v

  imagen:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t lumen .
      - name: Prueba de humo del contenedor
        run: |
          docker run -d -p 7860:7860 --name lumen lumen
          for i in $(seq 1 30); do curl -sf localhost:7860/salud && break; sleep 2; done
          curl -sf -X POST localhost:7860/api/generar -H 'Content-Type: application/json' \
               -d '{"n": 4, "semilla": 1}' | python -c "import json,sys; d=json.load(sys.stdin); assert len(d['personajes'])==4; print('ok', d['modelo'], d['latencia_ms'], 'ms')"
